# ============================================================================
# squid-1 — CURRENT architecture.
#
# Squid terminates CONNECT, resolves the destination, and tunnels the encrypted
# stream. It never sees plaintext; mTLS is end-to-end inside the tunnel.
#
# THIS FILE REPRODUCES THE REAL PRODUCTION ACCESS-CONTROL BLOCK VERBATIM.
# It is deliberately NOT hardened. See "access control" below.
#
# Port: Squid listens on 4443 (production's role_squid_proxy_port, and the port
# HAProxy's proxyhttp backend targets). This is NOT the client-facing port --
# clients talk to HAProxy on 38888 and never reach Squid directly.
# ============================================================================

# --- listener ---------------------------------------------------------------
http_port 4443

# --- identity ---------------------------------------------------------------
visible_hostname squid-1
httpd_suppress_version_string on

# --- DNS --------------------------------------------------------------------
# Production sets, identically on both instances:
#   dns_nameservers <current-site list> <remote-site list>
# The second list is the REMOTE datacenter's nameservers -- a real cross-site
# DNS fallback. The POC boundary excludes the second datacenter, so only the
# local pair is modelled. TARGET has no equivalent fallback; that loss is
# recorded as an accepted regression in docs/adr/0029.
#
# The reversal below is a brief §8 experiment with NO production counterpart:
# production uses the same list on both instances.
dns_nameservers 172.28.0.41 172.28.0.42

# Short retransmit/timeout so the "PowerDNS 1 down" scenario measures failover,
# not a stall. A timeout falls through to the next server; NXDOMAIN does not
# (it is a valid answer, not an infrastructure failure).
dns_retransmit_interval 1 seconds
dns_timeout 2 seconds

# --- caching: off -----------------------------------------------------------
# This layer is a CONNECT tunnel terminator, not a cache: the payload is opaque
# TLS. Production carries the same `cache deny all`.
cache deny all
cache_mem 0 MB
cache_dir null /tmp

# --- privacy / hygiene ------------------------------------------------------
# Transparent to the managed appliances downstream; leaks no client address.
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all

# --- access control: PRODUCTION, VERBATIM -----------------------------------
#
# No destination validation of any kind. The two allows are unrestricted by
# source AND by method; `deny to_localhost` sits after both and is therefore
# unreachable. Measured from Squid's own access log: CONNECT to 127.0.0.1,
# 169.254.169.254 and RFC1918 are all ALLOWED. The only refusal is port-based.
# CURRENT is an open forward proxy -- see docs/adr/0028.
acl to_localhost dst 127.0.0.0/8 0.0.0.0/32 ::1 172.28.0.21
acl env_network  src 0.0.0.0/32

acl SSL_ports port 443
acl SSL_ports port 445
acl SSL_ports port 8443
acl Safe_ports port 80
acl Safe_ports port 21
acl Safe_ports port 443
acl Safe_ports port 445
acl Safe_ports port 8443
acl Safe_ports port 70
acl Safe_ports port 210
acl Safe_ports port 1025-65535
acl Safe_ports port 280
acl Safe_ports port 488
acl Safe_ports port 591
acl Safe_ports port 777
acl CONNECT method CONNECT

# Production order, preserved exactly. The ordering IS the finding.
http_access allow env_network CONNECT
http_access allow SSL_ports
http_access allow Safe_ports
http_access deny to_localhost

# Squid's default when no rule matches is already deny; stating it changes
# nothing and makes the policy readable.
http_access deny all

# --- logging ----------------------------------------------------------------
# Access logging is off: at 6,000 rps the log stream would dominate the run and
# corrupt CPU and latency measurements. The security tests read the
# client-observed status code instead, and tests/fidelity/ re-runs this ACL
# block with logging on to capture Squid's own verdicts as evidence.
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache_store_log none

# --- worker model -----------------------------------------------------------
# Matches the per-service CPU budget used for HAProxy and dnsdist so the
# architecture comparison is resource-fair.
workers 4
