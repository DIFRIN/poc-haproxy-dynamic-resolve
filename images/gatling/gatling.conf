# ============================================================================
# Gatling configuration for the POC.
#
# Loaded as a CLASSLOADER RESOURCE named 'gatling.conf' -- that is, it must sit
# on the classpath, not merely somewhere on disk. Gatling logs
#   "Gatling will try to load 'gatling.conf' config file as ClassLoader resource"
# and if it is not on the classpath the file is silently ignored: every key
# falls back to its default and the run still completes, reporting a plausible
# but wrong result. The Dockerfile copies this to target/test-classes for
# exactly that reason.
#
# Key names below were taken from gatling-defaults.conf inside gatling-core
# 3.15.1, not from documentation prose. Two traps worth recording, because
# both fail SILENTLY:
#
#   * `type` must be the JAVA KeyStore algorithm name -- "PKCS12", not "p12".
#     gatling-defaults.conf comments the field as "possible values are jks and
#     p12", but Gatling passes the string straight to KeyStore.getInstance(),
#     so following that comment fails with
#       NoSuchAlgorithmException: p12 KeyStore not available
#     at startup.
#   * keys that do not exist are ignored without complaint, so a config that
#     looks applied can be doing nothing at all.
# ============================================================================

gatling {

  ssl {

    # --- the client identity, for mutual TLS --------------------------------
    # The same client certificate curl uses, exported as PKCS#12 by
    # scripts/gen-certs.sh. Java cannot read the PEM pair.
    #
    # For CURRENT this certificate is presented to the IoT Mock INSIDE the
    # CONNECT tunnel -- not to Squid. That is what makes an ordinary
    # proxy + keystore setup sufficient: the proxy only ever sees a CONNECT.
    keyStore {
      type = "PKCS12"
      file = "/pki/clients/client-valid.p12"
      password = "changeit"
    }

    # --- the CA, so the IoT Mock's server certificate verifies --------------
    # Gatling's default TrustManager trusts EVERYTHING, which would make a run
    # "succeed" against any certificate at all and render the mTLS assertions
    # meaningless. Pinning the POC root CA means the handshake only completes
    # against the Mock we actually started.
    trustStore {
      type = "PKCS12"
      file = "/pki/ca/ca.p12"
      password = "changeit"
    }

    # Hostname verification is off by default in Gatling, and it must stay off
    # here: requests are addressed to iotNNNNNNN.test.domain (so the SNI is
    # right) while the certificate's SANs cover *.test.domain -- verification
    # would work, but the connection is to the VIP rather than a resolved
    # address, and turning it on adds a failure mode with no security benefit
    # in a lab where we pin the CA explicitly.
  }
}
