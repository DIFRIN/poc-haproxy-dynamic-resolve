-- ===========================================================================
-- dnsdist — the LOCAL resolver for one HAProxy node (TARGET architecture).
--
-- Both dnsdist instances are configured IDENTICALLY. That is correct, not
-- laziness: dnsdist is not a paired active/standby application. Each HAProxy
-- node uses its OWN local dnsdist, and both dnsdist instances see BOTH
-- PowerDNS servers. There is no dnsdist-to-dnsdist relationship at all, so
-- there is nothing to differentiate. See ADR 0014 / 0015.
--
-- WHY THIS LAYER EXISTS
--   It is the DNS abstraction between HAProxy and the authoritative servers:
--   it load-balances, health-checks, and removes failed backends, so a
--   PowerDNS outage is absorbed here and never reaches HAProxy as an error.
--   That is what makes "PowerDNS failure must not move the VIP" true.
--
-- HAProxy is configured with exactly ONE nameserver -- this instance. It has no
-- PowerDNS fallback, by design. If this dnsdist dies, resolution fails and the
-- node's health check fails, which moves the VIP. See ADR 0016.
-- ===========================================================================

-- --- listener --------------------------------------------------------------
-- Port 53, not a high port.
-- Squid's `dns_nameservers` directive accepts NO port suffix and always queries
-- 53, so the whole DNS layer must live on 53 for CURRENT to be able to resolve
-- at all. Binding 53 is safe here because every container has its own network
-- namespace and nothing is published to the host; the containers run as uid
-- `pdns`, so docker-compose sets net.ipv4.ip_unprivileged_port_start=0 for them.
setLocal("0.0.0.0:53")

-- --- query admission --------------------------------------------------------
-- Only the DC LAN may query. An open authoritative-forwarding resolver is an
-- amplification reflector; this is not one, but the ACL makes that explicit
-- rather than incidental.
setACL({"127.0.0.0/8", "172.28.0.0/24"})

-- --- the common authoritative backend --------------------------------------
-- BOTH PowerDNS servers, from BOTH dnsdist instances. This is the "common
-- authoritative DNS backend" of the target architecture.
--
-- checkName/checkType: dnsdist's default health probe asks for
-- "a.root-servers.net." -- a name our authoritative servers would answer with
-- REFUSED, which dnsdist would score as a failure and mark every backend down.
-- Probing the zone apex SOA instead gets a real authoritative NOERROR, so the
-- health check measures what it is supposed to measure: whether this PowerDNS
-- can answer for OUR zone.
--
-- rise/maxFailures: 2 consecutive failures to eject, 2 successes to restore.
-- With checkInterval=1s that is a ~2s detection window, which is what the
-- "PowerDNS 1 failure" scenario measures against.
newServer({
  address="172.28.0.41:53",
  name="pdns-1",
  checkInterval=1,
  checkTimeout=500,
  checkName="test.domain",
  checkType="SOA",
  rise=2,
  order=1,
})

newServer({
  address="172.28.0.42:53",
  name="pdns-2",
  checkInterval=1,
  checkTimeout=500,
  checkName="test.domain",
  checkType="SOA",
  rise=2,
  order=2,
})

-- --- policy: EXPLICIT round-robin ------------------------------------------
-- Required by brief §9. Round-robin spreads queries evenly across both
-- PowerDNS servers regardless of load or latency, which makes the DNS
-- distribution measurable and reproducible. A latency-based policy would make
-- the split depend on machine noise and would defeat the comparison.
--
-- Measured effect: see docs/benchmark-report.md (DNS distribution section).
setServerPolicy(roundrobin)

-- --- locally-served health answer -------------------------------------------
-- The HAProxy nodes' Keepalived health check probes THIS name. dnsdist answers
-- it from local configuration, without consulting any backend.
--
-- This is load-bearing, not a convenience. If the probe instead asked for a
-- name that requires PowerDNS, then a total PowerDNS outage would fail the
-- health check on BOTH nodes. With the weighted check that means the active
-- node's priority drops 150->90 and the standby's 100->40, and whether the VIP
-- moves then depends only on which node happened to be active -- i.e. a
-- PowerDNS outage could move the VIP, violating the rule that it must not.
--
-- Answering locally makes the probe measure the right thing: is this node's
-- local dnsdist alive and serving? A dead dnsdist produces no response and
-- fails the check (correct: the node cannot resolve anything). PowerDNS health
-- is dnsdist's business, absorbed by its own backend health checks.
addAction(QNameRule("dnsdist-health.poc.internal."), SpoofAction("127.0.0.1"))

-- --- statistics -------------------------------------------------------------
-- The dnsdist web API is the source for DNS QPS, per-backend QPS, distribution,
-- health and latency in the benchmark harness. Bound to all interfaces inside
-- the container; the port is never published to the host.
webserver("0.0.0.0:8083")
setWebserverConfig({
  password="poc-dnsdist",
  apiKey="poc-dnsdist-api-key",
  -- Metric collection is the only consumer; no dashboards are exposed.
  acl="172.28.0.0/24,127.0.0.0/8",
})
