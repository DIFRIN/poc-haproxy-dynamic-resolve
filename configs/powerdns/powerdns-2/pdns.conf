# ============================================================================
# PowerDNS authoritative — node 2.
#
# Both nodes carry an IDENTICAL configuration and share ONE PostgreSQL
# database. Identical answers are therefore true by construction: there is no
# replication step that could lag or diverge, which is what makes "confirm both
# PowerDNS return identical data" a meaningful check rather than a race.
#
# Values below are the effective settings read back from the running server
# (`pdns_control current-config`), not defaults.
# ============================================================================

# --- backend ----------------------------------------------------------------
launch=gpgsql
gpgsql-host=172.28.0.50
gpgsql-port=5432
gpgsql-dbname=pdns
gpgsql-user=pdns
gpgsql-password=pdns_poc_password

# --- listener ---------------------------------------------------------------
local-address=0.0.0.0
local-port=53

# --- API / webserver --------------------------------------------------------
# Used by the benchmark harness and the failover tests to read QPS, latency and
# failure counters.
api=yes
api-key=poc-pdns-api-key
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

# --- caching: disabled ------------------------------------------------------
# Both the query cache and the packet cache are off so the POC measures the
# real PostgreSQL-backed path rather than a warm in-process cache. These are
# the main lever on what the DNS comparison actually measures.
query-cache-ttl=0
cache-ttl=0
